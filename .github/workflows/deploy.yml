name: Deploy Path and Paws to Fasthosts

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish app
      run: dotnet publish PathAndPaws.csproj -c Release -o publish -p:DebugType=None
      env:
          Resend__ApiKey: ${{ secrets.Resend__ApiKey }}

    - name: Deployment diagnostics
      run: |
        echo "Publish size:"
        du -sh publish

        echo "File count:"
        find publish -type f | wc -l

        echo "Largest files:"
        find publish -type f -exec ls -lh {} \; | sort -k5 -hr | head -20

    - name: Create app_offline.htm
      run: |
        cat > publish/app_offline.htm << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Path and Paws | Updating</title>

        <style>
          * {
              margin: 0;
              padding: 0;
        box-sizing: border-box;
         }

        body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background:
            linear-gradient(
                rgba(0,0,0,0.65),
                rgba(0,0,0,0.65)
            ),
            url('/assets/hero.png') center center / cover no-repeat;
        }

        .container {
        max-width: 700px;
        padding: 40px;
        }

        .logo {
        font-size: 2.8rem;
        font-weight: 700;
        margin-bottom: 20px;
        letter-spacing: 1px;
         }

        h1 {
        font-size: 2rem;
        margin-bottom: 20px;
        font-weight: 600;
        }

        p {
        font-size: 1.1rem;
        line-height: 1.7;
        opacity: 0.95;
        margin-bottom: 30px;
        }

        .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top: 4px solid white;
        border-radius: 50%;
        margin: 0 auto;
        animation: spin 1s linear infinite;
        }

        @keyframes spin {
        to {
            transform: rotate(360deg);
        }
        }

        .footer {
        margin-top: 40px;
        font-size: 0.9rem;
        opacity: 0.8;
        }
        </style>
        </head>

        <body>

        <div class="container">

            <div class="logo">
              Path and Paws
            </div>

        <h1>We're deploying an update</h1>

        <p>
        Our website is currently being updated with the latest improvements.
        Service will be restored automatically in a few minutes.
        </p>

        <div class="spinner"></div>

        <div class="footer">
        Thank you for your patience.
        </div>

        </div>

        </body>
        </html>
        EOF
    
    - name: Upload app_offline.htm
      run: |
        curl -T publish/app_offline.htm \
          --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          ftp://${{ secrets.FTP_SERVER }}/app_offline.htm

    - name: Wait for IIS shutdown
      run: sleep 10

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: publish/
        server-dir: /htdocs/
        exclude: |
          **/data/**
          **/*.db

    - name: Remove app_offline.htm from server
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp

        lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_SERVER }} <<EOF
        cd /htdocs
        rm app_offline.htm
        bye
        EOF

    #- name: Verify deployment
    #  run: |
    #    sleep 15
    #    curl --fail https://pathandpaws.co.uk/api/health

    - name: Verify deployment
      run: |
        echo "Waiting for application to restart..."
        sleep 15

        echo "Checking website..."
        curl -I -L --max-time 30 https://pathandpaws.co.uk/ || true

        echo ""
        echo "Checking health endpoint..."
        curl -i -L --max-time 30 https://pathandpaws.co.uk/api/health || true

        echo ""
        echo "Checking HTTP status..."
        curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
          --max-time 30 \
          https://pathandpaws.co.uk/api/health

    - name: Send success notification
      if: success()
      run: |
        curl -X POST https://api.resend.com/emails \
          -H "Authorization: Bearer ${{ secrets.RESEND__APIKEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "from": "Deploy Bot <onboarding@resend.dev>",
            "to": ["robin@visionaryanalytics.co.uk"],
            "subject": "✅ Path and Pets Deploy Succeeded",
            "html": "<h2>Deployment Successful</h2><p>The latest version of Path and Paws has been deployed successfully.</p>"
          }'
    
    - name: Send failure notification
      if: failure()
      run: |
        curl -X POST https://api.resend.com/emails \
          -H "Authorization: Bearer ${{ secrets.RESEND__APIKEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "from": "Deploy Bot <onboarding@resend.dev>",
            "to": ["robin@visionaryanalytics.co.uk"],
            "subject": "❌ Path and Paws Deploy FAILED",
            "html": "<h2>Deployment Failed</h2><p>Your GitHub Actions deployment failed. Check the Actions logs immediately.</p>"
          }'
