<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="/css/cookie-consent.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png"/>
</head>

<body>

<div id="nav-placeholder"></div>

<section class="hero">
  <div class="overlay"></div>
  <section class="page-content">
    <div class="box">

      <h1 id="title">Contact</h1>
      <p id="subhead">Ask us a question, or just get in touch</p>
      <form id="contactForm" class="contact-form">

      <div class="form-row">
        <input name="ownersname" placeholder="Your Name" required>
        <input name="dogsname" placeholder="Dogs Name" required>
      </div>

      <div class="form-row">
        <input name="email" placeholder="Email" required>
        <input name="phone" placeholder="Phone">
      </div>

      <div class="form-row full">
        <textarea name="notes" placeholder="Tell us about your requirements and your dog"></textarea>
      </div>

      <button type="submit" class="btn-primary">Send Enquiry</button>
      <input type="text" name="website" style="display:none">
      </form>
    </div>
  </section>
    
</section>


<script src="/js/include.js"></script>

<script>
document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = Object.fromEntries(new FormData(e.target));

  const res = await fetch("/api/contact", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  if (res.ok) {
    alert("Thanks — we’ll be in touch.");
    e.target.reset();
  } else {
    alert("Submission failed. Try again.");
  }
});

        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');

        const title = document.getElementById('title');
        const subhead = document.getElementById('subhead');

        switch(type) {
            case '1':
                title.innerText = 'Arrange a meet and greet !';
                subhead.innerText='Great, tell us a bit about yourself and your needs';
                break;
            case '2':
                title.innerText = 'Get in touch about the platform';
                subhead.innerText = 'Talk to us about this site and how it could help your business';
                break;
            case '3':
                title.innerText ='Talk to us about your wedding plans';
                subhead.innerText = 'Get in touch, to find out how we can help';
                break;
            default:
                title.innerText = 'General Contact';
        }


</script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
